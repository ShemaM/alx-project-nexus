# =============================================================================
# render.yaml — BYN-K Platform Full Monorepo Blueprint
#
# Deploys BOTH services from a single repo:
#   bynk-backend  → Django 5.2 + DRF   (backend/)
#   bynk-frontend → Next.js 15          (byn-k-platform/)
#
# How to use:
#   render.com → New → Blueprint → connect ShemaM/alx-project-nexus
#   Render reads this file and creates all services automatically.
#
# After first deploy, update these two env vars in the Render dashboard:
#   bynk-backend  → FRONTEND_URL  = your bynk-frontend.onrender.com URL
#   bynk-frontend → NEXTAUTH_URL  = your bynk-frontend.onrender.com URL
# =============================================================================

services:

  # ════════════════════════════════════════════════════════════════════════════
  # 1. DJANGO BACKEND
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    name: bynk-backend
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: "python manage.py migrate --no-input && gunicorn config.wsgi:application --workers 2 --worker-class gthread --worker-connections 1000 --max-requests 1000 --max-requests-jitter 50 --timeout 120 --bind 0.0.0.0:$PORT --access-logfile - --error-logfile -"
    healthCheckPath: /api/category-counts/
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com,.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: bynk-db
          property: connectionString
      # Celery runs in eager mode on free tier (no Redis needed)
      # Tasks execute synchronously — email confirmations still work
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: CELERY_TASK_EAGER_PROPAGATES
        value: "True"
      - key: SEND_EMAILS_ASYNC
        value: "False"
      # Email — swap to SMTP when you have credentials
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"
      # Update FRONTEND_URL after bynk-frontend is deployed
      - key: FRONTEND_URL
        value: "https://bynk-frontend.onrender.com"
      - key: BACKEND_PUBLIC_URL
        value: "https://bynk-backend.onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: shemamanase992@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true

  # ════════════════════════════════════════════════════════════════════════════
  # 2. NEXT.JS FRONTEND
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    name: bynk-frontend
    runtime: node
    region: oregon
    rootDir: byn-k-platform
    buildCommand: npm install -g pnpm@9 && pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: "production"
      # Points to the Django backend deployed above
      - key: NEXT_PUBLIC_API_URL
        value: "https://bynk-backend.onrender.com/api"
      # Update NEXTAUTH_URL to your actual frontend URL after first deploy
      - key: NEXTAUTH_URL
        value: "https://bynk-frontend.onrender.com"
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: "https://bynk-frontend.onrender.com"

# ════════════════════════════════════════════════════════════════════════════
# DATABASE
# ════════════════════════════════════════════════════════════════════════════
databases:
  - name: bynk-db
    databaseName: bynk_production
    user: bynk_user
    region: oregon
    plan: free

# ════════════════════════════════════════════════════════════════════════════
# AFTER DEPLOYMENT CHECKLIST
# ════════════════════════════════════════════════════════════════════════════
# 1. Get your frontend URL from bynk-frontend service page
# 2. Go to bynk-backend → Environment → update FRONTEND_URL
# 3. Go to bynk-frontend → Environment → update NEXTAUTH_URL
# 4. Go to bynk-backend → Environment → get DJANGO_SUPERUSER_PASSWORD
# 5. Visit https://bynk-backend.onrender.com/admin/ to log in
# 6. (Optional) Buy banyamulengefursa.org and add as custom domain
