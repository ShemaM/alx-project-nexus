# =============================================================================
# render.yaml — BYN-K Platform Infrastructure
# Deploys the Django backend as a Render Web Service.
# Commit this file → Render auto-creates/updates services.
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ── Django Web Server ──────────────────────────────────────────────────────
  - type: web
    name: bynk-backend
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: >-
      gunicorn config.wsgi:application
      --workers 2
      --worker-class gthread
      --worker-connections 1000
      --max-requests 1000
      --max-requests-jitter 50
      --timeout 120
      --bind 0.0.0.0:$PORT
      --access-logfile -
      --error-logfile -
    healthCheckPath: /api/category-counts/
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render generates a random secret automatically
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com,.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: bynk-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: bynk-redis
          type: redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: SEND_EMAILS_ASYNC
        value: "True"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"  # Change to SMTP in prod
      - key: FRONTEND_URL
        value: "https://byn-k-platform.vercel.app"   # Update to your actual Vercel URL
      - key: BACKEND_PUBLIC_URL
        value: "https://bynk-backend.onrender.com"  # Update to your actual Render URL
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: shemamanase992@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true          # Render generates a random password — save it!
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ── Celery Background Worker ────────────────────────────────────────────────
  - type: worker
    name: bynk-celery-worker
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=info --concurrency=2
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        fromService:
          name: bynk-backend
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: bynk-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: bynk-redis
          type: redis
          property: connectionString
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"

databases:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  - name: bynk-db
    databaseName: bynk_production
    user: bynk_user
    region: oregon
    plan: free

# ── Redis (for Celery task queue) ─────────────────────────────────────────────
# NOTE: Render's free Redis is in the services block, not databases.
# Add this manually in the Render dashboard:
# New → Redis → name: bynk-redis → free plan
