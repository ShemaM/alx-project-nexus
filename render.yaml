# =============================================================================
# render.yaml — BYN-K Platform Full Monorepo Blueprint
#
# Deploys BOTH services from a single repo:
#   bynk-backend  → Django 5.2 + DRF   (backend/)
#   bynk-frontend → Next.js 15          (byn-k-platform/)
#
# How to use:
#   render.com → New → Blueprint → connect ShemaM/alx-project-nexus
#   Render reads this file and creates all services automatically.
#
# After first deploy, update these two env vars in the Render dashboard:
#   bynk-backend  → FRONTEND_URL  = your actual bynk-frontend.onrender.com URL
#   bynk-frontend → NEXTAUTH_URL  = your actual bynk-frontend.onrender.com URL
# =============================================================================

services:

  # ════════════════════════════════════════════════════════════════════════════
  # 1. DJANGO BACKEND
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    name: bynk-backend
    runtime: python
    region: oregon
    rootDir: backend

    # Phase 1 — BUILD (no DB access): install deps + collectstatic
    buildCommand: bash build.sh

    # Phase 2 — PRE-DEPLOY (has DB access): migrate + create superuser
    # Runs after build, before traffic switches. Rolled back on failure.
    preDeployCommand: python manage.py migrate --no-input && python manage.py create_superuser_safe

    # Phase 3 — START: pure gunicorn, zero DB setup
    startCommand: gunicorn config.wsgi:application --workers 2 --worker-class gthread --worker-connections 1000 --max-requests 1000 --max-requests-jitter 50 --timeout 120 --bind 0.0.0.0:$PORT --access-logfile - --error-logfile -

    healthCheckPath: /health/
    plan: free

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com,.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: bynk-db
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: CELERY_TASK_EAGER_PROPAGATES
        value: "True"
      - key: SEND_EMAILS_ASYNC
        value: "False"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"
      - key: FRONTEND_URL
        value: "https://bynk-frontend.onrender.com"
      - key: BACKEND_PUBLIC_URL
        value: "https://bynk-backend.onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: shemamanase992@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true

  # ════════════════════════════════════════════════════════════════════════════
  # 2. NEXT.JS FRONTEND
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    name: bynk-frontend
    runtime: node
    region: oregon
    rootDir: byn-k-platform
    buildCommand: npm install -g pnpm@9 && pnpm install && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    plan: free

    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: "production"
      - key: NEXT_PUBLIC_API_URL
        value: "https://bynk-backend.onrender.com/api"
      - key: NEXTAUTH_URL
        value: "https://bynk-frontend.onrender.com"
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: "https://bynk-frontend.onrender.com"

# ════════════════════════════════════════════════════════════════════════════
# DATABASE
# ════════════════════════════════════════════════════════════════════════════
databases:
  - name: bynk-db
    databaseName: bynk_production
    user: bynk_user
    region: oregon
    plan: free

# ════════════════════════════════════════════════════════════════════════════
# POST-DEPLOY CHECKLIST
# ════════════════════════════════════════════════════════════════════════════
# 1. Get your frontend URL from the bynk-frontend service page
# 2. bynk-backend  → Environment → update FRONTEND_URL to that URL
# 3. bynk-frontend → Environment → update NEXTAUTH_URL to that URL
# 4. bynk-backend  → Environment → copy DJANGO_SUPERUSER_PASSWORD
# 5. Visit https://bynk-backend.onrender.com/admin/ → log in as admin
# 6. (Optional) Buy banyamulengefursa.org → add as custom domain
